name: Android build

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/android/**/*.gradle*
            src/android/**/gradle-wrapper.properties
            src/android/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build standard Android release
        run: ./.ci/android/build.sh --target standard --build-type Release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: eden-android-standard-${{ github.run_number }}
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 14
